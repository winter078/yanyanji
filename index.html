<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>言言机</title>
  <script>
    (function () {
      var p = location.pathname;
      if (p !== '/phone' && p !== '/phone.html') {
        location.replace('/phone' + (location.search || '') + (location.hash || ''));
      }
    })();
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #15171b; color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; box-sizing: border-box; text-align: center; }
    .title { font-size: 19px; font-weight: 600; letter-spacing: 1px; }
    .sub { font-size: 13px; color: #9aa0aa; line-height: 1.7; }
    a.btn { display: inline-block; padding: 11px 22px; border-radius: 999px; background: #07c160; color: #06210f; font-size: 14px; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">言言机 · 新版入口</div>
    <div class="sub">正在进入新版小手机…<br />如果 3 秒内没有跳转，点下面按钮。</div>
    <a class="btn" href="/phone">进入小手机</a>
  </div>
  <script>
    setTimeout(function () { location.replace('/phone' + (location.search || '') + (location.hash || '')); }, 1200);
  </script>
</body>
</html>
