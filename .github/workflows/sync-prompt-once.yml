name: sync-prompt-once

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  sync:
    if: contains(github.event.head_commit.message, '[sync-prompt-v2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and push
        run: |
          set -euo pipefail
          echo '' | base64 -d | gunzip > /tmp/change.patch
          git apply --whitespace=nowarn /tmp/change.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-prompt-once.yml
          git add phone.html js/build.js js/prompt-presets.js js/theater/worldbooks.js
          git commit -m "fix: 解锁聊天预设并全量注入世界书"
          git push origin HEAD:main
