name: sync-prompt-once

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  sync:
    if: contains(github.event.head_commit.message, '[sync-prompt-v3]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and push
        run: |
          set -euo pipefail
          python3 tools/_patch_prompt.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/_patch_prompt.py
          git rm .github/workflows/sync-prompt-once.yml
          git add phone.html js/prompt-presets.js
          git add js/theater/worldbooks.js
          git commit -m "fix: 解锁聊天预设并全量注入世界书"
          git push origin HEAD:main
