name: Apply reader companion fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply reader companion fix script'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fix and commit
        run: |
          set -e
          python3 apply_reader_fix.py
          rm -f apply_reader_fix.py reader-companion-fix.patch reader-companion-fix.b64
          rm -f .github/workflows/apply-reader-companion-fix.yml
          git config user.name 'winter078'
          git config user.email 'winter078@users.noreply.github.com'
          git add -A
          git commit -m 'fix(reader): 一起读换人后名字、头像和对话角色名同步更新'
          git push origin HEAD:main

      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
