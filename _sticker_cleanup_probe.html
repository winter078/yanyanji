<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>sticker builtin cleanup probe</title></head>
<body>
<script>
  const builtin1 = { id: 'st_1', name: '摸摸头', category: '默认', url: 'assets/stickers/cat_tietie.png' };
  const builtin2 = { id: 'st_cat_momo_1', name: '猫猫旧预设', category: '小猫咪', url: 'assets/stickers/cat_tietie.png' };
  const mine = { id: 'st_local_123_abcd', name: '我的表情', category: '默认', url: 'data:image/png;base64,iVBORw0KGgo=', note: '自己存的' };
  localStorage.setItem('momo_stickers_v10', JSON.stringify([builtin1, builtin2, mine]));
  localStorage.setItem('momo_sticker_categories_v6', JSON.stringify(['默认', '小猫咪']));
  localStorage.setItem('momo_stickers_presets_archived_v1', JSON.stringify([builtin1, builtin2]));
  localStorage.removeItem('momo_deleted_sticker_ids');
  localStorage.removeItem('momo_stickers_builtin_cleaned_v1');
  localStorage.removeItem('momo_stickers_presets_restored_v1');
  const f = document.createElement('iframe');
  f.src = '/index.html?v=2026111150';
  f.style.cssText = 'width:1px;height:1px;border:0;';
  f.addEventListener('load', function () {
    setTimeout(function () {
      const list = JSON.parse(localStorage.getItem('momo_stickers_v10') || '[]');
      const archive = localStorage.getItem('momo_stickers_presets_archived_v1');
      const clean = localStorage.getItem('momo_stickers_builtin_cleaned_v1');
      const pre = document.createElement('pre');
      pre.id = 'probe-result';
      pre.textContent = [
        (list.length === 1 && list[0].id === 'st_local_123_abcd' ? 'PASS ' : 'FAIL ') + 'only builtin stickers removed :: ' + JSON.stringify(list),
        (archive === null ? 'PASS ' : 'FAIL ') + 'archive cleared :: ' + archive,
        (clean === '1' ? 'PASS ' : 'FAIL ') + 'cleanup marker set :: ' + clean
      ].join('\n');
      document.body.appendChild(pre);
    }, 1200);
  });
  document.body.appendChild(f);
</script>
</body>
</html>
