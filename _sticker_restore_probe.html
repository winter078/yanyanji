<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>sticker restore probe</title></head>
<body>
<script>
  const preset = { id: 'st_cat_momo_1', name: '猫猫旧预设', category: '小猫咪', url: 'assets/stickers/cat_tietie.png' };
  localStorage.setItem('momo_stickers_v10', '[]');
  localStorage.setItem('momo_sticker_categories_v6', JSON.stringify(['小猫咪', '默认']));
  localStorage.setItem('momo_stickers_presets_archived_v1', JSON.stringify([preset]));
  localStorage.removeItem('momo_stickers_presets_restored_v1');
  localStorage.removeItem('momo_deleted_sticker_ids');
  const f = document.createElement('iframe');
  f.src = '/index.html?v=2026111150';
  f.style.cssText = 'width:1px;height:1px;border:0;';
  f.addEventListener('load', function () {
    setTimeout(function () {
      const list = JSON.parse(localStorage.getItem('momo_stickers_v10') || '[]');
      const marker = localStorage.getItem('momo_stickers_presets_restored_v1');
      const pre = document.createElement('pre');
      pre.id = 'probe-result';
      pre.textContent = [
        (list.length === 1 && list[0].id === 'st_cat_momo_1' ? 'PASS ' : 'FAIL ') + 'empty library restores archived stickers :: ' + JSON.stringify(list),
        (marker === '1' ? 'PASS ' : 'FAIL ') + 'restore is one-time, not repeated :: ' + marker
      ].join('\n');
      document.body.appendChild(pre);
    }, 1200);
  });
  document.body.appendChild(f);
</script>
</body>
</html>
