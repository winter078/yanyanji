<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>sticker purge probe</title></head>
<body>
<script>
  const preset = { id: 'st_cat_momo_1', name: '猫猫旧预设', category: '小猫咪', url: 'assets/stickers/cat_tietie.png' };
  const custom = { id: 's_local', name: '我自己存的', category: '默认', url: 'assets/stickers/cat_hate_you.png', note: '' };
  localStorage.setItem('momo_stickers_v10', JSON.stringify([preset, custom]));
  localStorage.setItem('momo_sticker_categories_v6', JSON.stringify(['小猫咪', '默认']));
  localStorage.removeItem('momo_stickers_presets_archived_v1');
  localStorage.removeItem('momo_deleted_sticker_ids');
  const f = document.createElement('iframe');
  f.src = '/index.html?v=2026111147';
  f.style.cssText = 'width:1px;height:1px;border:0;';
  f.addEventListener('load', function () {
    setTimeout(function () {
      const list = JSON.parse(localStorage.getItem('momo_stickers_v10') || '[]');
      const archive = JSON.parse(localStorage.getItem('momo_stickers_presets_archived_v1') || '[]');
      const pre = document.createElement('pre');
      pre.id = 'probe-result';
      pre.textContent = [
        (list.length === 1 && list[0].name === '我自己存的' ? 'PASS ' : 'FAIL ') + 'built-in preset purged from visible library :: ' + JSON.stringify(list),
        (archive.length === 1 && archive[0].id === 'st_cat_momo_1' ? 'PASS ' : 'FAIL ') + 'preset archived instead of destroyed :: ' + JSON.stringify(archive)
      ].join('\n');
      document.body.appendChild(pre);
    }, 1200);
  });
  document.body.appendChild(f);
</script>
</body>
</html>
